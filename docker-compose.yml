name: backend

services:
  # ============================================================================
  # 1. MySQL 8 Relational Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: documind-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-documind_db}
      MYSQL_USER: ${MYSQL_USER:-documind_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - documind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - documind-network

  # ============================================================================
  # 2. Qdrant Vector Database Service
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - documind_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - documind-network

  # ============================================================================
  # 3. DocuMind .NET 10 Web API Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-documind_db};Uid=${MYSQL_USER:-documind_user};Pwd=${MYSQL_PASSWORD};
      - Database__ConnectionString=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-documind_db};Uid=${MYSQL_USER:-documind_user};Pwd=${MYSQL_PASSWORD};
      - Qdrant__Endpoint=http://qdrant:6333
      - AzureOpenAi__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAi__ApiKey=${AZURE_OPENAI_API_KEY}
      - AzureOpenAi__ChatDeploymentName=${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1-mini}
      - AzureOpenAi__EmbeddingDeploymentName=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - Storage__Path=/app/App_Data/uploads
    volumes:
      - documind_uploads:/app/App_Data/uploads
      - documind_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - documind-network

  # ============================================================================
  # 4. DocuMind React 19 Frontend + Nginx Reverse Proxy Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - documind-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  documind_mysql_data:
    name: documind_mysql_data
  documind_qdrant_data:
    name: documind_qdrant_data
  documind_uploads:
    name: documind_uploads
  documind_logs:
    name: documind_logs

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  documind-network:
    name: documind-network
    driver: bridge
