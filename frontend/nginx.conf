server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Include default MIME types and map JavaScript module (.mjs) extension
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Root directory for compiled React Vite assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for text, scripts and styling
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Frontend React SPA Routing Fallback
    location / {
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 2. Static bundle assets with cache clearing header
    location /assets/ {
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 3. Backend REST API & Real-Time SSE Reverse Proxy
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical SSE streaming configuration: disable buffering and caching
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived timeouts for streaming LLM generation and retrieval
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Support large PDF document uploads (up to 50MB)
        client_max_body_size 50M;
    }

    # 4. Frontend Container Health Check Endpoint
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
